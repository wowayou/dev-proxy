name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run Python isolation suites
        run: python -B -m unittest tests.test_shell_template tests.test_interop_runtime -v

      - name: Run PowerShell config fixture
        shell: pwsh
        run: ./tests/test_config_review.ps1
